name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Υπάρχει Maven project;
        id: detect
        run: |
          if [ -f pom.xml ]; then
            echo "has_pom=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pom=false" >> "$GITHUB_OUTPUT"
            echo "Δεν υπάρχει ακόμα pom.xml (Sprint 0, πριν το US-03). Το build παραλείπεται."
          fi

      - name: Εγκατάσταση Java 21
        if: steps.detect.outputs.has_pom == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Μεταγλώττιση + όλα τα tests (+ στατική ανάλυση, όταν προστεθεί στο pom.xml από το US-04)
      - name: Build και tests
        if: steps.detect.outputs.has_pom == 'true'
        run: mvn -B verify
