name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build, Tests & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Εγκατάσταση Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Μεταγλώττιση, tests και στατική ανάλυση (Checkstyle, SpotBugs, PMD)
        run: mvn -B verify

      - name: Ανέβασμα αναφορών ελέγχου και στατικής ανάλυσης
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-and-analysis-reports
          path: |
            target/surefire-reports/
            target/checkstyle-result.xml
            target/spotbugsXml.xml
            target/pmd.xml
          retention-days: 14
